{{template "head" .}}
<header class="top">
  <div class="top-left">
    <h1>DEAD DROP</h1>
    <div class="case" aria-label="Room code {{.Code}}">CASE <b>{{.Code}}</b></div>
    <div class="series{{if and (not .EmberWins) (not .TideWins)}} hidden{{end}}" id="series-score" aria-label="Series score"><span class="s-ember" data-wins="ember">{{.EmberWins}}</span><span class="sep">–</span><span class="s-tide" data-wins="tide">{{.TideWins}}</span></div>
  </div>
  <div class="top-actions">
    <button type="button" class="btn compact" id="mute-btn" aria-pressed="false" title="Toggle sound">Sound</button>
  </div>
</header>
<div class="wrap">
{{template "game" .}}
</div>
{{template "foot" .}}
